<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <!-- CRT scanlines -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect width="4" height="2" fill="#050505"/>
    </pattern>

    <!-- Subtle vignette/radial glow behind logotype -->
    <radialGradient id="glow" cx="35%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#00ffc8" stop-opacity="0.22"/>
      <stop offset="45%"  stop-color="#00ffc8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-magenta" cx="78%" cy="55%" r="35%">
      <stop offset="0%"   stop-color="#ff3ea5" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#ff3ea5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff3ea5" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft neon halo for the wordmark -->
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Atmospheric glows -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow-magenta)"/>

  <!-- Grid lines (synthwave floor hint) -->
  <g stroke="#00ffc8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="565" x2="1200" y2="565"/>
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="0" y1="615" x2="1200" y2="615"/>
  </g>
  <g stroke="#00ffc8" stroke-opacity="0.06" stroke-width="1">
    <!-- vanishing-point verticals -->
    <line x1="100"  y1="540" x2="-200" y2="630"/>
    <line x1="300"  y1="540" x2="200"  y2="630"/>
    <line x1="500"  y1="540" x2="450"  y2="630"/>
    <line x1="700"  y1="540" x2="750"  y2="630"/>
    <line x1="900"  y1="540" x2="1000" y2="630"/>
    <line x1="1100" y1="540" x2="1400" y2="630"/>
  </g>

  <!-- ============================================================ -->
  <!-- PIXEL-ART ARCADE CABINET (right side) -->
  <!-- ============================================================ -->
  <!-- Drawn on an 8px pixel grid, anchored around x=880, y=130 -->
  <g transform="translate(880, 130)" shape-rendering="crispEdges">
    <!-- Cabinet silhouette (dark hull) -->
    <!-- Top marquee -->
    <rect x="16"  y="0"   width="192" height="40"  fill="#1a1a1a"/>
    <rect x="16"  y="0"   width="192" height="40"  fill="none" stroke="#00ffc8" stroke-width="2" stroke-opacity="0.9"/>
    <!-- Marquee text background glow -->
    <rect x="24"  y="8"   width="176" height="24"  fill="#001a16"/>
    <text x="112" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#00ffc8" letter-spacing="2">HACKCADE</text>

    <!-- Cabinet body sides -->
    <rect x="8"   y="40"  width="216" height="240" fill="#0d0d0d"/>
    <rect x="8"   y="40"  width="216" height="240" fill="none" stroke="#222" stroke-width="2"/>
    <!-- Highlight edge -->
    <rect x="8"   y="40"  width="4"   height="240" fill="#00ffc8" fill-opacity="0.35"/>
    <rect x="220" y="40"  width="4"   height="240" fill="#ff3ea5" fill-opacity="0.30"/>

    <!-- Screen bezel -->
    <rect x="32"  y="56"  width="160" height="120" fill="#000"/>
    <rect x="32"  y="56"  width="160" height="120" fill="none" stroke="#333" stroke-width="2"/>

    <!-- Screen content: tiny "game" -->
    <rect x="36"  y="60"  width="152" height="112" fill="#020a08"/>
    <!-- starfield -->
    <rect x="48"  y="72"  width="2" height="2" fill="#ffd166"/>
    <rect x="92"  y="86"  width="2" height="2" fill="#fff"/>
    <rect x="140" y="76"  width="2" height="2" fill="#00ffc8"/>
    <rect x="60"  y="100" width="2" height="2" fill="#fff"/>
    <rect x="160" y="110" width="2" height="2" fill="#ffd166"/>
    <rect x="120" y="124" width="2" height="2" fill="#fff"/>
    <rect x="80"  y="140" width="2" height="2" fill="#ff3ea5"/>
    <!-- pixel ship -->
    <g fill="#00ffc8">
      <rect x="104" y="140" width="16" height="4"/>
      <rect x="100" y="144" width="24" height="4"/>
      <rect x="108" y="148" width="8"  height="4"/>
      <rect x="96"  y="148" width="4"  height="4"/>
      <rect x="124" y="148" width="4"  height="4"/>
    </g>
    <!-- HUD bar -->
    <rect x="40"  y="64"  width="40" height="4" fill="#00ffc8" fill-opacity="0.8"/>
    <rect x="144" y="64"  width="40" height="4" fill="#ff3ea5" fill-opacity="0.8"/>
    <!-- scanlines on screen -->
    <g fill="#000" fill-opacity="0.25">
      <rect x="36" y="62"  width="152" height="1"/>
      <rect x="36" y="68"  width="152" height="1"/>
      <rect x="36" y="74"  width="152" height="1"/>
      <rect x="36" y="80"  width="152" height="1"/>
      <rect x="36" y="86"  width="152" height="1"/>
      <rect x="36" y="92"  width="152" height="1"/>
      <rect x="36" y="98"  width="152" height="1"/>
      <rect x="36" y="104" width="152" height="1"/>
      <rect x="36" y="110" width="152" height="1"/>
      <rect x="36" y="116" width="152" height="1"/>
      <rect x="36" y="122" width="152" height="1"/>
      <rect x="36" y="128" width="152" height="1"/>
      <rect x="36" y="134" width="152" height="1"/>
      <rect x="36" y="140" width="152" height="1"/>
      <rect x="36" y="146" width="152" height="1"/>
      <rect x="36" y="152" width="152" height="1"/>
      <rect x="36" y="158" width="152" height="1"/>
      <rect x="36" y="164" width="152" height="1"/>
      <rect x="36" y="170" width="152" height="1"/>
    </g>

    <!-- Control panel -->
    <rect x="24"  y="184" width="176" height="56" fill="#0a0a0a"/>
    <rect x="24"  y="184" width="176" height="56" fill="none" stroke="#222" stroke-width="2"/>

    <!-- Joystick base + stick + ball -->
    <rect x="44"  y="200" width="20" height="20" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="50"  y="194" width="8"  height="20" fill="#222"/>
    <rect x="48"  y="188" width="12" height="12" fill="#ff3ea5"/>
    <rect x="50"  y="190" width="4"  height="4"  fill="#ffb6dd"/>

    <!-- Buttons row -->
    <rect x="84"  y="204" width="14" height="14" fill="#ff6b6b"/>
    <rect x="86"  y="206" width="4"  height="4"  fill="#ffb3b3"/>
    <rect x="106" y="204" width="14" height="14" fill="#ffd166"/>
    <rect x="108" y="206" width="4"  height="4"  fill="#ffe7a8"/>
    <rect x="128" y="204" width="14" height="14" fill="#00ffc8"/>
    <rect x="130" y="206" width="4"  height="4"  fill="#a8ffe8"/>
    <rect x="150" y="204" width="14" height="14" fill="#7b5cff"/>
    <rect x="152" y="206" width="4"  height="4"  fill="#beaeff"/>

    <!-- Coin slot -->
    <rect x="100" y="252" width="40" height="20" fill="#0a0a0a" stroke="#333" stroke-width="2"/>
    <rect x="114" y="258" width="12" height="2"  fill="#00ffc8" fill-opacity="0.6"/>
    <text x="120" y="280" text-anchor="middle" font-size="9" fill="#666" letter-spacing="1">FREE PLAY</text>

    <!-- Cabinet base/feet -->
    <rect x="0"   y="280" width="232" height="16" fill="#080808"/>
    <rect x="0"   y="280" width="232" height="2"  fill="#00ffc8" fill-opacity="0.5"/>
  </g>

  <!-- ============================================================ -->
  <!-- WORDMARK + TAGLINE (left) -->
  <!-- ============================================================ -->

  <!-- Tiny eyebrow chip -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="190" height="28" fill="#000" stroke="#00ffc8" stroke-width="1.5"/>
    <text x="14" y="19" font-size="14" font-weight="700" fill="#00ffc8" letter-spacing="3">// HACK.TEZ</text>
  </g>

  <!-- HACKCADE — big neon -->
  <g transform="translate(80, 170)">
    <!-- Soft outer glow layer -->
    <text x="0" y="120" font-size="148" font-weight="900" fill="#00ffc8" fill-opacity="0.25" letter-spacing="-4" filter="url(#neon)">HACKCADE</text>
    <!-- Main fill -->
    <text x="0" y="120" font-size="148" font-weight="900" fill="#00ffc8" letter-spacing="-4">HACKCADE</text>
    <!-- Inner highlight -->
    <text x="0" y="120" font-size="148" font-weight="900" fill="#ffffff" fill-opacity="0.35" letter-spacing="-4">HACKCADE</text>
  </g>

  <!-- Cursor caret -->
  <rect x="80" y="320" width="18" height="3" fill="#00ffc8"/>

  <!-- Tagline (terminal-style) -->
  <g transform="translate(80, 360)" font-weight="700">
    <text x="0" y="0" font-size="28" fill="#ffffff" letter-spacing="0">
      <tspan>build</tspan>
      <tspan fill="#666" dx="6">·</tspan>
      <tspan dx="6">ship</tspan>
      <tspan fill="#666" dx="6">·</tspan>
      <tspan dx="6">play</tspan>
    </text>
  </g>

  <!-- Sub description -->
  <g transform="translate(80, 410)">
    <text x="0" y="0" font-size="20" fill="#aaaaaa" letter-spacing="0.5">
      Community-built HTML5 games.
    </text>
    <text x="0" y="28" font-size="20" fill="#aaaaaa" letter-spacing="0.5">
      Sign in with your hack.tez domain.
    </text>
  </g>

  <!-- Bottom badge bar -->
  <g transform="translate(80, 540)">
    <!-- pill 1 -->
    <rect x="0" y="0" width="148" height="34" fill="#001a16" stroke="#00ffc8" stroke-width="1.5"/>
    <text x="74" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#00ffc8" letter-spacing="2">FREE TO PLAY</text>
    <!-- pill 2 -->
    <rect x="160" y="0" width="172" height="34" fill="#1a0d00" stroke="#ffd166" stroke-width="1.5"/>
    <text x="246" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="2">COMMUNITY BUILT</text>
    <!-- pill 3 -->
    <rect x="344" y="0" width="186" height="34" fill="#1a0009" stroke="#ff3ea5" stroke-width="1.5"/>
    <text x="437" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#ff3ea5" letter-spacing="2">TEZOS IDENTITY</text>
  </g>

  <!-- URL bottom-right -->
  <g transform="translate(1120, 590)" text-anchor="end">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.5">hack.tez<tspan fill="#00ffc8">/arcade</tspan></text>
  </g>

  <!-- Scanline overlay over everything (very subtle) -->
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.35" style="mix-blend-mode: overlay"/>

  <!-- Edge vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
