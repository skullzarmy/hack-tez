<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#fff" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.03"/>

  <!-- Border -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>

  <!-- Main title: * .hack .tez — three tspans for color control -->
  <text x="600" y="310" font-family="'Courier New',monospace" font-size="180" font-weight="700" letter-spacing="-2" text-anchor="middle">
    <tspan fill="#666">*</tspan><tspan fill="#fff">.hack</tspan><tspan fill="#555">.tez</tspan>
  </text>

  <!-- Divider -->
  <rect x="480" y="345" width="240" height="2" fill="#fff" opacity="0.35"/>

  <!-- Punchy line — near white -->
  <text x="600" y="418" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="#ddd" letter-spacing="6" text-anchor="middle">CLAIM YOUR NAME.</text>

  <!-- Intrigue hook — brighter than before -->
  <text x="600" y="478" font-family="'Courier New',monospace" font-size="20" fill="#bbb" letter-spacing="4" text-anchor="middle">For hackers. For builders. For Tezos.</text>
</svg>
