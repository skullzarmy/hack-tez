<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#fff" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.03"/>

  <!-- Border -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>

  <!-- Eyebrow: "Tezos subdomain Registry" -->
  <text x="600" y="120" font-family="'Courier New',monospace" font-size="15" fill="#888" letter-spacing="4" text-anchor="middle">Tezos subdomain Registry</text>

  <!-- Hero title: *.HACK.TEZ -->
  <!-- * -->
  <text x="242" y="360" font-family="'Courier New',monospace" font-size="100" font-weight="700" fill="#888" text-anchor="middle" dominant-baseline="auto">*</text>
  <!-- . (small dot before HACK) -->
  <text x="318" y="365" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#888" text-anchor="middle">.</text>
  <!-- HACK -->
  <text x="600" y="370" font-family="'Courier New',monospace" font-size="220" font-weight="700" fill="#fff" letter-spacing="-4" text-anchor="middle" dominant-baseline="auto">HACK</text>
  <!-- .TEZ -->
  <text x="1050" y="365" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#fff" opacity="0.55" letter-spacing="3" text-anchor="middle">.TEZ</text>

  <!-- Divider -->
  <rect x="540" y="400" width="120" height="2" fill="#fff" opacity="0.4"/>

  <!-- Manifesto lines -->
  <text x="600" y="448" font-family="'Courier New',monospace" font-size="15" fill="#999" letter-spacing="3" text-anchor="middle">This is an invitation.</text>
  <text x="600" y="474" font-family="'Courier New',monospace" font-size="14" fill="#666" letter-spacing="2" text-anchor="middle">For those who build what should exist.</text>
  <text x="600" y="498" font-family="'Courier New',monospace" font-size="14" fill="#666" letter-spacing="2" text-anchor="middle">For those who break what can be broken.</text>
  <text x="600" y="522" font-family="'Courier New',monospace" font-size="14" fill="#666" letter-spacing="2" text-anchor="middle">For Tezos.</text>

  <!-- CTA -->
  <text x="600" y="575" font-family="'Courier New',monospace" font-size="13" fill="#555" letter-spacing="3" text-anchor="middle">Claim your name — early access open now</text>
</svg>
