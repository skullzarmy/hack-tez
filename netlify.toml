[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# SPA routing — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.tzkt.io https://*.tezos.domains https://*.teztnets.com https://mainnet.tezos.marigold.dev https://matrix.papers.tech wss://relay.walletbeacon.io; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'"
