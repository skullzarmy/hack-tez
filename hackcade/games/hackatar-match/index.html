<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hackatar Match</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span class="hud-pill" id="hud-moves">MOVES <b>0</b></span>
      <span class="hud-pill" id="hud-time">TIME <b>0s</b></span>
    </div>
    <div class="hud-center">
      <span class="hud-pill score" id="hud-score">SCORE <b>0</b></span>
      <span class="hud-pill combo hidden" id="hud-combo">COMBO ×<b>1</b></span>
    </div>
    <div class="hud-right">
      <button id="sound-toggle" type="button" aria-label="Toggle sound" title="Toggle sound">
        <svg id="sound-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8.05v7.9a4.5 4.5 0 0 0 2.5-3.95zM14 4v2.06a6 6 0 0 1 0 11.88V20a8 8 0 0 0 0-16z"/></svg>
        <svg id="sound-off" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 8.05v2.21l2.45 2.45c.03-.23.05-.47.05-.71zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.94 8.94 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>
  </header>

  <main id="board-wrap">
    <div id="board" class="diff-normal"></div>
    <div id="match-banner" class="hidden"></div>
  </main>

  <div id="overlay" class="screen-title">
    <div class="overlay-card">
      <h1 class="title">HACKATAR<br/><span>MATCH</span></h1>
      <p class="tag">Flip pairs of <em>real</em> hackatars from registered builders.<br/>Chain combos. Beat the clock. Claim the high score.</p>

      <div class="diff-picker">
        <button class="diff-btn" data-diff="easy">EASY<small>6 pairs</small></button>
        <button class="diff-btn selected" data-diff="normal">NORMAL<small>8 pairs</small></button>
        <button class="diff-btn" data-diff="hard">HARD<small>12 pairs</small></button>
      </div>

      <button id="start" class="btn-primary">START</button>
      <p class="loading hidden" id="loading-msg">Summoning hackatars…</p>
      <p class="error hidden" id="error-msg"></p>
    </div>
  </div>

  <div id="endscreen" class="hidden">
    <div class="overlay-card endcard">
      <h2 id="end-title">VICTORY</h2>
      <div class="stat-row"><span>SCORE</span><b id="end-score">0</b></div>
      <div class="stat-row"><span>MOVES</span><b id="end-moves">0</b></div>
      <div class="stat-row"><span>TIME</span><b id="end-time">0s</b></div>
      <div class="stat-row"><span>BEST COMBO</span><b id="end-combo">×1</b></div>
      <div class="stat-row"><span>PERFECT</span><b id="end-perfect">—</b></div>
      <button id="play-again" class="btn-primary">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
