[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# SPA routing — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://verify.walletconnect.org https://verify.walletconnect.com; connect-src 'self' ws://localhost:* http://localhost:* https://*.tzkt.io https://*.tezos.domains https://*.teztnets.com https://mainnet.tezos.marigold.dev https://matrix.papers.tech wss://matrix.papers.tech wss://relay.walletbeacon.io https://beacon-node-1.octez.io https://beacon-node-2.octez.io https://beacon-node-3.octez.io https://beacon-node-4.octez.io https://beacon-node-5.octez.io https://beacon-node-6.octez.io https://beacon-node-7.octez.io https://beacon-node-8.octez.io wss://beacon-node-1.octez.io wss://beacon-node-2.octez.io wss://beacon-node-3.octez.io wss://beacon-node-4.octez.io wss://beacon-node-5.octez.io wss://beacon-node-6.octez.io wss://beacon-node-7.octez.io wss://beacon-node-8.octez.io https://beacon-backend.prod.gke.papers.tech wss://beacon-backend.prod.gke.papers.tech https://rpc.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org wss://us-east-1.relay.walletconnect.com wss://eu-central-1.relay.walletconnect.com wss://ap-southeast-1.relay.walletconnect.com https://pulse.walletconnect.org https://verify.walletconnect.org https://verify.walletconnect.com https://echo.walletconnect.com https://explorer-api.walletconnect.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'"
