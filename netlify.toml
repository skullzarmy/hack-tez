[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = [
    "dist/index.html",
    "dist/assets/fonts/*",
    "node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff",
    "node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2",
    "node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff",
    "node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2",
    "hackcade/sdk/hackcade-sdk.js",
  ]

# SPA routing — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # 'unsafe-inline' removed from script-src: the Vite build emits no inline
    # scripts (module preload polyfill is disabled).  JSON-LD <script> tags are
    # data blocks, not executable code, and are unaffected by script-src.
    # The sha256 hash allows @vitejs/plugin-react's Fast Refresh preamble
    # (an inline module script) when running `netlify dev`. It matches nothing
    # in production builds so is a no-op there.
    # Hash is tied to @vitejs/plugin-react@6.0.1 — recompute if that package updates:
    #   printf '%s' "$(cat node_modules/@vitejs/plugin-react/dist/refresh-runtime.js | ...)" | openssl dgst -sha256 -binary | base64
    # Easier: just run `netlify dev`, the browser error will show the new hash.
    # FORK NOTE: Replace hackchat.rejkt.workers.dev with your own CF Worker URL.
    # The *.partykit.dev wildcard covers any PartyKit deployment.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' 'unsafe-inline'; frame-src 'self' https://verify.walletconnect.org https://verify.walletconnect.com; connect-src 'self' ws://localhost:* http://localhost:* https://*.tzkt.io https://*.tezos.domains https://*.teztnets.com https://mainnet.tezos.marigold.dev https://matrix.papers.tech wss://matrix.papers.tech wss://relay.walletbeacon.io https://beacon-node-1.octez.io https://beacon-node-2.octez.io https://beacon-node-3.octez.io https://beacon-node-4.octez.io https://beacon-node-5.octez.io https://beacon-node-6.octez.io https://beacon-node-7.octez.io https://beacon-node-8.octez.io wss://beacon-node-1.octez.io wss://beacon-node-2.octez.io wss://beacon-node-3.octez.io wss://beacon-node-4.octez.io wss://beacon-node-5.octez.io wss://beacon-node-6.octez.io wss://beacon-node-7.octez.io wss://beacon-node-8.octez.io https://beacon-backend.prod.gke.papers.tech wss://beacon-backend.prod.gke.papers.tech https://rpc.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org wss://us-east-1.relay.walletconnect.com wss://eu-central-1.relay.walletconnect.com wss://ap-southeast-1.relay.walletconnect.com https://pulse.walletconnect.org https://verify.walletconnect.org https://verify.walletconnect.com https://echo.walletconnect.com https://explorer-api.walletconnect.com https://hackchat.rejkt.workers.dev wss://hackchat.rejkt.workers.dev https://*.partykit.dev wss://*.partykit.dev; img-src 'self' data: blob: https:; font-src 'self'; base-uri 'self'; frame-ancestors 'self'"

# Long-lived immutable cache for content-hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hackcade game bundles must be embeddable in same-origin iframes.
# Override the global frame-ancestors 'none' / X-Frame-Options DENY.
[[headers]]
  for = "/arcade-files/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
